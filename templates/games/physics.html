<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;margin:0;padding:20px;}
  .box{background:white;border-radius:16px;padding:30px;
       max-width:560px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
  h2{color:#1565c0;}
  #q{font-size:1.05rem;font-weight:600;padding:16px;background:#e3f2fd;
     border-radius:10px;border-left:4px solid #1565c0;margin-bottom:20px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{padding:13px 18px;border:2px solid #90cae9;border-radius:10px;
       background:white;cursor:pointer;font-size:0.95rem;text-align:left;transition:all 0.2s;}
  .opt:hover{background:#e3f2fd;}
  .opt.correct{background:#c8e6c9;border-color:#2e7d32;color:#1b5e20;}
  .opt.wrong{background:#ffcdd2;border-color:#c62828;color:#b71c1c;}
  #sc{color:#757575;margin-top:14px;}
</style>
</head>
<body>
<div class="box">
  <h2>Physics — Forces & Motion Quiz</h2>
  <div id="q"></div>
  <div class="opts" id="opts"></div>
  <div id="sc">Score: 0 / 0</div>
</div>
<script>
const qs=[
  {q:'What is the unit of force?',o:['Joule','Newton','Watt','Pascal'],a:1},
  {q:'Which force pulls objects towards the Earth?',o:['Friction','Magnetism','Gravity','Tension'],a:2},
  {q:'Newton\'s First Law states that an object at rest will:',o:['Always move','Stay at rest unless acted upon','Accelerate','Float'],a:1},
  {q:'What is the formula for speed?',o:['Speed = Force × Time','Speed = Distance ÷ Time','Speed = Mass × Acceleration','Speed = Energy ÷ Mass'],a:1},
  {q:'Which force opposes motion between surfaces?',o:['Gravity','Friction','Tension','Normal force'],a:1},
  {q:'What happens to an object when balanced forces act on it?',o:['It accelerates','It stops','No change in motion','It moves in a circle'],a:2},
  {q:'The unit of energy is:',o:['Newton','Watt','Joule','Pascal'],a:2},
  {q:'What does a newton meter measure?',o:['Mass','Weight/Force','Speed','Temperature'],a:1},
  {q:'Which has more inertia — a truck or a bicycle?',o:['Bicycle','They are equal','Truck','Depends on speed'],a:2},
  {q:'Power is defined as:',o:['Force × Distance','Energy ÷ Time','Mass × Speed','Force × Time'],a:1},
];
let idx=0,score=0,total=0;
function show(){
  if(idx>=qs.length){idx=0;}
  const q=qs[idx];
  document.getElementById('q').textContent='Q'+(idx+1)+': '+q.q;
  const el=document.getElementById('opts');el.innerHTML='';
  q.o.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=['A','B','C','D'][i]+'. '+o;
    btn.onclick=()=>{
      total++;
      document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
      if(i===q.a){score++;btn.classList.add('correct');}
      else{btn.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');}
      document.getElementById('sc').textContent='Score: '+score+' / '+total;
      idx++;setTimeout(show,1400);
    };
    el.appendChild(btn);
  });
}
show();
</script>
</body>
</html>
