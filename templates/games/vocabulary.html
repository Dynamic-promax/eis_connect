<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;margin:0;padding:20px;}
  .box{background:white;border-radius:16px;padding:30px;
       max-width:560px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
  h2{color:#6a1b9a;}
  #word{font-size:2rem;font-weight:700;color:#6a1b9a;
        text-align:center;padding:16px;background:#f3e5f5;
        border-radius:10px;margin-bottom:16px;}
  #q{font-size:0.95rem;color:#424242;margin-bottom:16px;text-align:center;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{padding:13px 18px;border:2px solid #ce93d8;border-radius:10px;
       background:white;cursor:pointer;font-size:0.9rem;text-align:left;transition:all 0.2s;}
  .opt:hover{background:#f3e5f5;}
  .opt.correct{background:#c8e6c9;border-color:#2e7d32;color:#1b5e20;}
  .opt.wrong{background:#ffcdd2;border-color:#c62828;color:#b71c1c;}
  #sc{color:#757575;margin-top:14px;text-align:center;}
</style>
</head>
<body>
<div class="box">
  <h2>Vocabulary Builder</h2>
  <div id="word"></div>
  <div id="q">What does this word mean?</div>
  <div class="opts" id="opts"></div>
  <div id="sc">Score: 0 / 0</div>
</div>
<script>
const vocab=[
  {w:'Benevolent',m:'Kind and generous',wrong:['Cruel','Lazy','Fearful']},
  {w:'Eloquent',m:'Well-spoken and expressive',wrong:['Silent','Angry','Confused']},
  {w:'Diligent',m:'Hard-working and careful',wrong:['Lazy','Rude','Careless']},
  {w:'Abundant',m:'More than enough; plentiful',wrong:['Scarce','Small','Hidden']},
  {w:'Concise',m:'Short and clear',wrong:['Long','Vague','Loud']},
  {w:'Tranquil',m:'Peaceful and calm',wrong:['Noisy','Angry','Fast']},
  {w:'Ambitious',m:'Having a strong desire to succeed',wrong:['Lazy','Scared','Bored']},
  {w:'Vivid',m:'Very bright or clear',wrong:['Dull','Dark','Quiet']},
  {w:'Skeptical',m:'Doubtful; not easily convinced',wrong:['Trusting','Happy','Brave']},
  {w:'Resilient',m:'Able to recover quickly from difficulty',wrong:['Weak','Slow','Tired']},
  {w:'Candid',m:'Honest and straightforward',wrong:['Dishonest','Shy','Loud']},
  {w:'Inquisitive',m:'Curious; eager to learn',wrong:['Bored','Rude','Sleepy']},
];
let idx=0,score=0,total=0;
function show(){
  if(idx>=vocab.length){idx=0;}
  const v=vocab[idx];
  document.getElementById('word').textContent=v.w;
  const opts=[v.m,...v.wrong].sort(()=>Math.random()-0.5);
  const el=document.getElementById('opts');el.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=o;
    btn.onclick=()=>{
      total++;
      document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
      if(o===v.m){score++;btn.classList.add('correct');}
      else{btn.classList.add('wrong');
        document.querySelectorAll('.opt').forEach(b=>{
          if(b.textContent===v.m)b.classList.add('correct');
        });}
      document.getElementById('sc').textContent='Score: '+score+' / '+total;
      idx++;setTimeout(show,1400);
    };
    el.appendChild(btn);
  });
}
show();
</script>
</body>
</html>
