<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;margin:0;padding:20px;}
  .box{background:white;border-radius:16px;padding:30px;
       max-width:560px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
  h2{color:#2e7d32;}
  #element{font-size:3rem;font-weight:700;color:#1a237e;
           text-align:center;padding:20px;background:#e8eaf6;
           border-radius:12px;margin-bottom:20px;}
  #q{font-size:1rem;font-weight:600;color:#424242;margin-bottom:16px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt{padding:13px;border:2px solid #9fa8da;border-radius:10px;
       background:white;cursor:pointer;font-size:1rem;font-weight:600;
       text-align:center;transition:all 0.2s;}
  .opt:hover{background:#e8eaf6;}
  .opt.correct{background:#c8e6c9;border-color:#2e7d32;}
  .opt.wrong{background:#ffcdd2;border-color:#c62828;}
  #sc{color:#757575;margin-top:14px;text-align:center;}
</style>
</head>
<body>
<div class="box">
  <h2>Chemistry Elements Quiz</h2>
  <div id="element"></div>
  <div id="q"></div>
  <div class="opts" id="opts"></div>
  <div id="sc">Score: 0 / 0</div>
</div>
<script>
const elements=[
  {name:'Hydrogen',symbol:'H',number:1},
  {name:'Helium',symbol:'He',number:2},
  {name:'Carbon',symbol:'C',number:6},
  {name:'Nitrogen',symbol:'N',number:7},
  {name:'Oxygen',symbol:'O',number:8},
  {name:'Sodium',symbol:'Na',number:11},
  {name:'Magnesium',symbol:'Mg',number:12},
  {name:'Aluminium',symbol:'Al',number:13},
  {name:'Silicon',symbol:'Si',number:14},
  {name:'Sulfur',symbol:'S',number:16},
  {name:'Chlorine',symbol:'Cl',number:17},
  {name:'Calcium',symbol:'Ca',number:20},
  {name:'Iron',symbol:'Fe',number:26},
  {name:'Copper',symbol:'Cu',number:29},
  {name:'Zinc',symbol:'Zn',number:30},
  {name:'Silver',symbol:'Ag',number:47},
  {name:'Gold',symbol:'Au',number:79},
  {name:'Mercury',symbol:'Hg',number:80},
];
let score=0,total=0;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function newQ(){
  const idx=rand(0,elements.length-1);
  const e=elements[idx];
  const type=Math.random()>0.5?'symbol':'name';
  if(type==='symbol'){
    document.getElementById('element').textContent=e.name;
    document.getElementById('q').textContent='What is the chemical symbol for '+e.name+'?';
    const wrong=elements.filter(x=>x!==e)
      .sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.symbol);
    makeOpts([e.symbol,...wrong],e.symbol);
  } else {
    document.getElementById('element').textContent=e.symbol;
    document.getElementById('q').textContent='Which element has the symbol "'+e.symbol+'"?';
    const wrong=elements.filter(x=>x!==e)
      .sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.name);
    makeOpts([e.name,...wrong],e.name);
  }
}
function makeOpts(opts,correct){
  opts=opts.sort(()=>Math.random()-0.5);
  const el=document.getElementById('opts');
  el.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=o;
    btn.onclick=()=>{
      total++;
      document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
      if(o===correct){score++;btn.classList.add('correct');}
      else{btn.classList.add('wrong');
        document.querySelectorAll('.opt').forEach(b=>{
          if(b.textContent===correct)b.classList.add('correct');
        });}
      document.getElementById('sc').textContent='Score: '+score+' / '+total;
      setTimeout(newQ,1400);
    };
    el.appendChild(btn);
  });
}
newQ();
</script>
</body>
</html>
