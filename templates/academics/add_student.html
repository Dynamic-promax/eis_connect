{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card p-4">
            <h5 class="fw-bold mb-4">Add New Student</h5>

            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Admission Number</label>
                        <input type="text" name="admission_number" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Surname</label>
                        <input type="text" name="surname" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Class</label>
                        <select name="school_class" class="form-select" required>
                            <option value="">Select class</option>
                            {% for c in classes %}
                            <option value="{{ c.id }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Parent (optional)</label>
                        <select name="parent" class="form-select">
                            <option value="">Select parent</option>
                            {% for p in parents %}
                            <option value="{{ p.id }}">{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Passport Photo (optional)</label>
                        <input type="file" name="passport" class="form-control" accept="image/*">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn text-white px-4" style="background-color:#1a237e;">
                            Save Student
                        </button>
                        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
